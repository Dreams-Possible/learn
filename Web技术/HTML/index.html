<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 入门练习</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <script src="../JavaScript/main.js" defer></script>
  </head>
  <body>
    <main>
      <h1>我的 Web 学习笔记</h1>
      <p class="intro">从一个小页面开始，理解结构、样式和交互。</p>
      <ul>
        <li>HTML：组织页面内容。</li>
        <li>CSS：设置页面样式。</li>
        <li>JavaScript：响应用户操作。</li>
      </ul>
      <p aria-live="polite">学习次数：<span id="count">0</span></p>
      <div class="actions">
        <button id="learn-button" type="button">记录一次学习</button>
        <button id="reset-button" type="button">重置</button>
      </div>
      <p>次数仅在本次页面打开期间保留，刷新后归零。</p>
      <p><a href="https://www.runoob.com/">去菜鸟教程继续学习</a></p>
      <noscript>请启用 JavaScript 后体验按钮交互。</noscript>
    </main>
  </body>
</html>
